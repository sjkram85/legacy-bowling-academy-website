<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Legacy Bowling Academy">
  <title>Legacy Bowling Academy</title>
  <defs>
<linearGradient id="lba-silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="28%" stop-color="#CBD5E1" />
        <stop offset="52%" stop-color="#64748B" />
        <stop offset="76%" stop-color="#E2E8F0" />
        <stop offset="100%" stop-color="#94A3B8" />
      </linearGradient>

      <!-- Shield Navy Inner Gradient -->
      <linearGradient id="lba-navy-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#142B47" />
        <stop offset="55%" stop-color="#0B192C" />
        <stop offset="100%" stop-color="#06101D" />
      </linearGradient>

      <!-- Electric Cyan Arrow Gradient -->
      <linearGradient id="lba-cyan-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0284C7" />
        <stop offset="48%" stop-color="#00D4FF" />
        <stop offset="100%" stop-color="#7DD3FC" />
      </linearGradient>

      <!-- Glowing Cyan Bowling Ball Radial Gradient -->
      <radialGradient id="lba-ball-grad" cx="38%" cy="32%" r="65%">
        <stop offset="0%" stop-color="#E0F7FF" />
        <stop offset="28%" stop-color="#38BDF8" />
        <stop offset="62%" stop-color="#0284C7" />
        <stop offset="100%" stop-color="#082F49" />
      </radialGradient>

      <!-- Pin Metallic Gradient -->
      <linearGradient id="lba-pin-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#94A3B8" />
        <stop offset="35%" stop-color="#F8FAFC" />
        <stop offset="72%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>

  </defs>

        <!-- Silver Laurel Leaves Left -->
        <g fill="url(#lba-silver-grad)" opacity="0.95">
          <path d="M27 89 C20 93, 21 101, 29 102 C27 97, 26 93, 27 89 Z" />
          <path d="M24 101 C18 107, 22 115, 31 114 C28 110, 26 105, 24 101 Z" />
          <path d="M29 114 C25 121, 31 128, 40 125 C36 122, 32 118, 29 114 Z" />
          <path d="M39 125 C37 132, 44 138, 53 134 C48 132, 43 128, 39 125 Z" />
          <path d="M51 134 C51 141, 59 145, 67 140 C61 139, 55 137, 51 134 Z" />
          <path d="M34 99 C30 105, 32 111, 38 112 C36 107, 35 103, 34 99 Z" />
          <path d="M40 112 C38 118, 42 123, 48 122 C45 119, 42 116, 40 112 Z" />
        </g>

        <!-- Silver Laurel Leaves Right -->
        <g fill="url(#lba-silver-grad)" opacity="0.95">
          <path d="M133 89 C140 93, 139 101, 131 102 C133 97, 134 93, 133 89 Z" />
          <path d="M136 101 C142 107, 138 115, 129 114 C132 110, 134 105, 136 101 Z" />
          <path d="M131 114 C135 121, 129 128, 120 125 C124 122, 128 118, 131 114 Z" />
          <path d="M121 125 C123 132, 116 138, 107 134 C112 132, 117 128, 121 125 Z" />
          <path d="M109 134 C109 141, 101 145, 93 140 C99 139, 105 137, 109 134 Z" />
          <path d="M126 99 C130 105, 128 111, 122 112 C124 107, 125 103, 126 99 Z" />
          <path d="M120 112 C122 118, 118 123, 112 122 C115 119, 118 116, 120 112 Z" />
        </g>

        <!-- Outer Metallic Silver Shield -->
        <path d="M80 12 L130 30 L127 78 C124 111 104 135 80 148 C56 135 36 111 33 78 L30 30 Z"
              fill="url(#lba-navy-grad)" stroke="url(#lba-silver-grad)" stroke-width="5.5" stroke-linejoin="round" />

        <!-- Inner Electric Cyan Shield Trim -->
        <path d="M80 21 L121 36 L118 76 C116 104 99 125 80 137 C61 125 44 104 42 76 L39 36 Z"
              fill="none" stroke="#00D4FF" stroke-width="1.8" stroke-opacity="0.72" />

        <!-- Three Silver Bowling Pins Inside Shield -->
        <!-- Left Pin -->
        <g>
          <path d="M60 44 C63.5 44 65.5 46.5 65.5 49.5 C65.5 51.8 64.2 53.8 63.4 55.5 C63 56.4 63 57.5 63.8 58.6 C66.2 62.5 68.2 67.5 68.2 74 C68.2 80 66.5 85 64.5 88 L55.5 88 C53.5 85 51.8 80 51.8 74 C51.8 67.5 53.8 62.5 56.2 58.6 C57 57.5 57 56.4 56.6 55.5 C55.8 53.8 54.5 51.8 54.5 49.5 C54.5 46.5 56.5 44 60 44 Z" fill="url(#lba-pin-grad)" />
          <rect x="55.8" y="55.5" width="8.4" height="2" rx="1" fill="#0284C7" />
          <rect x="55.2" y="59.2" width="9.6" height="1.8" rx="0.9" fill="#00D4FF" />
        </g>

        <!-- Right Pin -->
        <g>
          <path d="M100 44 C103.5 44 105.5 46.5 105.5 49.5 C105.5 51.8 104.2 53.8 103.4 55.5 C103 56.4 103 57.5 103.8 58.6 C106.2 62.5 108.2 67.5 108.2 74 C108.2 80 106.5 85 104.5 88 L95.5 88 C93.5 85 91.8 80 91.8 74 C91.8 67.5 93.8 62.5 96.2 58.6 C97 57.5 97 56.4 96.6 55.5 C95.8 53.8 94.5 51.8 94.5 49.5 C94.5 46.5 96.5 44 100 44 Z" fill="url(#lba-pin-grad)" />
          <rect x="95.8" y="55.5" width="8.4" height="2" rx="1" fill="#0284C7" />
          <rect x="95.2" y="59.2" width="9.6" height="1.8" rx="0.9" fill="#00D4FF" />
        </g>

        <!-- Center Pin (Taller, Wearing Graduation Cap) -->
        <g>
          <path d="M80 41 C84 41 86.2 43.8 86.2 47.2 C86.2 49.8 84.8 52 83.8 54 C83.4 55 83.4 56.2 84.2 57.5 C87 61.8 89.2 67.5 89.2 74.8 C89.2 81.2 87.2 86.8 85 90 L75 90 C72.8 86.8 70.8 81.2 70.8 74.8 C70.8 67.5 73 61.8 75.8 57.5 C76.6 56.2 76.6 55 76.2 54 C75.2 52 73.8 49.8 73.8 47.2 C73.8 43.8 76 41 80 41 Z" fill="url(#lba-pin-grad)" />
          <rect x="75.2" y="54.2" width="9.6" height="2.2" rx="1" fill="#0284C7" />
          <rect x="74.4" y="58.2" width="11.2" height="2" rx="1" fill="#00D4FF" />
          <!-- Silver Graduation Cap on Center Pin -->
          <polygon points="80,29 96,35 80,41 64,35" fill="url(#lba-silver-grad)" stroke="#0E1B2C" stroke-width="1" />
          <path d="M72 38.5 L72 43.5 C75 45.5 85 45.5 88 43.5 L88 38.5" fill="#CBD5E1" stroke="#0E1B2C" stroke-width="0.9" />
          <!-- Cap Tassel -->
          <line x1="92" y1="36.5" x2="92" y2="45.5" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round" />
          <circle cx="92" cy="46.5" r="1.6" fill="#00D4FF" />
        </g>

        <!-- Diagonal Electric Cyan Speed Streaks & Bold Upward-Right Arrow -->
        <path d="M36 124 L125 35" stroke="#00D4FF" stroke-width="3.2" stroke-linecap="round" opacity="0.55" />
        <path d="M46 134 L132 48" stroke="#0284C7" stroke-width="2.4" stroke-linecap="round" opacity="0.65" />
        <path d="M32 132 L126 38 L114 34 L147 20 L137 54 L131 44 L44 134 Z"
              fill="url(#lba-cyan-arrow)" stroke="#08111D" stroke-width="1.6" stroke-linejoin="round" />

        <!-- Glowing Electric Cyan Bowling Ball in Foreground -->
        <circle cx="80" cy="92" r="24" fill="#08111D" stroke="url(#lba-silver-grad)" stroke-width="2.5" />
        <circle cx="80" cy="92" r="21.5" fill="url(#lba-ball-grad)" />
        <!-- Ball Specular Highlight -->
        <ellipse cx="73" cy="83" rx="6.5" ry="4" transform="rotate(-28 73 83)" fill="#FFFFFF" opacity="0.55" />
        <!-- Finger & Thumb Holes -->
        <circle cx="85" cy="82" r="2.5" fill="#06101D" />
        <circle cx="91.5" cy="85.5" r="2.5" fill="#06101D" />
        <circle cx="86" cy="91.5" r="3.1" fill="#06101D" />
      </svg>
